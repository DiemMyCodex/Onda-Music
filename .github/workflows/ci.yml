name: Onda CI

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed ARM64 Release APK (R8)'
        required: false
        default: true
        type: boolean
      build_debug:
        description: 'Also build ARM64 Debug APK (no R8, fast)'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: onda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest -x :app:testUniversalDebugUnitTest --console=plain

  build_arm64_release:
    name: ARM64 Release APK
    if: github.event_name != 'workflow_dispatch' || inputs.build_release != false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Release Keystore
        env:
          ONDA_KEYSTORE_BASE64: ${{ secrets.ONDA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ONDA_KEYSTORE_BASE64" ]; then
            echo "$ONDA_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/onda-release.jks"
          fi

      - name: Build ARM64 Release APK
        env:
          ONDA_KEYSTORE_PATH: ${{ runner.temp }}/onda-release.jks
          ONDA_KEYSTORE_PASSWORD: ${{ secrets.ONDA_KEYSTORE_PASSWORD }}
          ONDA_KEY_ALIAS: ${{ secrets.ONDA_KEY_ALIAS }}
          ONDA_KEY_PASSWORD: ${{ secrets.ONDA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleArm64Release -x lintVitalArm64Release -x lintVitalAnalyzeArm64Release -x lintVitalAnalyzeRelease --console=plain

      - name: Upload ARM64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: onda-arm64-release
          path: app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
          retention-days: 14

  build_arm64_debug:
    name: ARM64 Debug APK (On-Demand)
    if: github.event_name == 'workflow_dispatch' && inputs.build_debug == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ARM64 Debug APK
        run: ./gradlew :app:assembleArm64Debug --console=plain

      - name: Upload ARM64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onda-arm64-debug
          path: app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 14
