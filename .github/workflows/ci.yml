name: Onda Music CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: Unit Tests & ARM64 Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests and Build Debug APKs
        run: ./gradlew testDebugUnitTest :app:assembleDebug :app:assembleArm64Debug --no-daemon --console=plain

      - name: Upload ARM64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onda-music-arm64-debug
          path: app/build/outputs/apk/arm64/debug/*.apk
          retention-days: 14
