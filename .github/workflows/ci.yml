name: Onda CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: Unit Tests & ARM64 Release + Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Release Keystore
        env:
          ONDA_KEYSTORE_BASE64: ${{ secrets.ONDA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ONDA_KEYSTORE_BASE64" ]; then
            echo "$ONDA_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/onda-release.jks"
          fi

      - name: Run Unit Tests and Build ARM64 Release & Debug APKs
        env:
          ONDA_KEYSTORE_PATH: ${{ runner.temp }}/onda-release.jks
          ONDA_KEYSTORE_PASSWORD: ${{ secrets.ONDA_KEYSTORE_PASSWORD }}
          ONDA_KEY_ALIAS: ${{ secrets.ONDA_KEY_ALIAS }}
          ONDA_KEY_PASSWORD: ${{ secrets.ONDA_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest :app:assembleArm64Release :app:assembleArm64Debug --no-daemon --console=plain

      - name: Upload ARM64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: onda-arm64-release
          path: app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onda-arm64-debug
          path: app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 14
